[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-script-agent"
version = "0.1.0"
description = "Subtitle archive tooling for the YouTube video script Codex skills"
requires-python = ">=3.11"
dependencies = ["yt-dlp[default]==2026.11.23"]

[project.scripts]
youtube-subtitles = "youtube_script_agent.download:main"

[tool.setuptools.packages.find]
where = ["src"]
